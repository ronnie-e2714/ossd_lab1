name: Lab 1 execution and evidence
on:
  push:
    branches: [main]
    paths-ignore: ['screenshots/**', 'evidence/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt playwright==1.51.0
          playwright install --with-deps chromium
      - name: Test and train
        run: |
          python -m pytest -q
          python train.py
      - name: Install kind
        run: |
          curl -fLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Deploy
        run: bash scripts/deploy.sh
      - name: Load test and capture real evidence
        run: |
          mlflow ui --backend-store-uri sqlite:///mlflow.db --host 127.0.0.1 > /tmp/mlflow.log 2>&1 &
          kubectl port-forward svc/iris-api 8080:80 > /tmp/forward.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz && curl -fsS http://127.0.0.1:5000/health; then break; fi
            sleep 2
          done
          curl -f http://127.0.0.1:8080/predict -H 'Content-Type: application/json' -d '{"instances":[[5.1,3.5,1.4,0.2]]}'
          python scripts/load.py --seconds 300 > evidence/load.json &
          LOAD_PID=$!
          python scripts/capture.py
          wait "$LOAD_PID"
      - name: Save artifacts for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab1-evidence
          path: |
            screenshots/
            evidence/
      - name: Commit verified evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/*.png evidence/
          git diff --cached --quiet || git commit -m 'Add actual MLflow and HPA execution evidence [skip ci]'
          git push
